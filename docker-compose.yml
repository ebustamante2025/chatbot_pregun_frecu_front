version: '3.8'

# Preguntas Frecuentes Frontend - Requiere que api-backend esté corriendo
# Se conecta a la red crm-chatbot-network (creada por chatbot_api_backend)
#
# Docker: copie .env.example → .env y ejecute:
#   docker compose up -d --build
#
# Localhost (Vite): copie .env.development.example → .env.development y:
#   npm run dev
#
# Plantillas: .env.example | .env.development.example

services:
  preguntas-frecuentes-front:
    build:
      context: .
      dockerfile: Dockerfile
    image: preguntas-frecuentes-front:latest
    container_name: preguntas-frecuentes-front
    ports:
      - "${FAQ_FRONT_PORT:-3008}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - crm-chatbot-network
    restart: unless-stopped

networks:
  crm-chatbot-network:
    external: true
